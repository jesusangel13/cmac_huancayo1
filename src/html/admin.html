<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Admin | CMAC Huancayo
    </title>

    <style>

        body{

            background:#111;

            color:white;

            font-family:Arial;

            display:flex;

            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .card{

            background:#1e1e1e;

            padding:40px;

            border-radius:20px;

            width:400px;

            box-shadow:
            0 0 30px red;
        }

        input{

            width:100%;

            padding:15px;

            margin-top:20px;

            border:none;

            border-radius:10px;
        }

        button{

            width:100%;

            margin-top:20px;

            padding:15px;

            border:none;

            border-radius:10px;

            background:red;

            color:white;

            font-weight:bold;

            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>
        Eliminar Usuario
    </h1>

    <form
        action="/delete-user"
        method="post"
    >

        <input
            type="text"
            name="dni"
            placeholder="DNI del usuario"
            required
        >

        <button type="submit">
            ELIMINAR
        </button>

    </form>

</div>

</body>

</html>
